name: Deploy staging Orbit

# Every push to the redesign branch publishes it to the separate staging
# project, with its own data and rules. Live users never see it until
# redesign is merged into main. See STAGING.md.
on:
  push:
    branches: [redesign]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: firebase-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-firebase.yml
    secrets: inherit
    with:
      mode: staging
      # Filled in from STAGING.md step 2.
      project_id: orbit-staging-49988
      workload_identity_provider: projects/2531876823/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      service_account: orbit-deployer@orbit-staging-49988.iam.gserviceaccount.com
      # No worker: staging never sends real budget-access notifications.
      worker_url: ""
