name: Deploy live Orbit

# Every merge to main publishes the app, Firestore rules and indexes to the
# live project (orbit-cbd4e). Keyless; see _deploy-firebase.yml.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: firebase-deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-firebase.yml
    secrets: inherit
    with:
      mode: production
      project_id: orbit-cbd4e
      # Filled in from STAGING.md step 1.
      workload_identity_provider: projects/944702899935/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      service_account: orbit-deployer@orbit-cbd4e.iam.gserviceaccount.com
      worker_url: ${{ vars.VITE_WORKER_URL }}
